<!doctype html>
<html lang="is">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#147d7e">
  <meta name="description" content="Íslenskt ritunar- og fingrafimiforrit með stýrðri innsláttaraðstoð.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Ritfimi</title>
</head>
<body>
  <header class="app-header">
    <button class="brand" id="home-button" aria-label="Fara á forsíðu">
      <span aria-hidden="true">⌨</span> RITFIMI
    </button>
    <div class="header-actions">
      <button class="header-button" id="sound-button" aria-pressed="true" title="Hljóð">🔊</button>
      <button class="header-button install" id="install-button">Setja upp app</button>
      <span id="header-info">Veldu stig</span>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <dialog id="install-dialog">
    <div class="dialog-content">
      <button class="dialog-close" id="dialog-close" aria-label="Loka">×</button>
      <h2>Setja Ritfimi upp</h2>
      <div id="install-instructions"></div>
      <button class="primary-button" id="dialog-install">Setja upp núna</button>
    </div>
  </dialog>

  <noscript>Ritfimi þarf JavaScript til að virka.</noscript>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
